services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadforge}
      POSTGRES_DB: ${POSTGRES_DB:-leadforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-leadforge}:${POSTGRES_PASSWORD:-leadforge}@db:5432/${POSTGRES_DB:-leadforge}
      LEADFORGE_PROVIDER: ${LEADFORGE_PROVIDER:-demo}
      LEADFORGE_AI_ENABLED: ${LEADFORGE_AI_ENABLED:-false}
      LEADFORGE_LLM_API_KEY: ${LEADFORGE_LLM_API_KEY:-}
      LEADFORGE_DEMO_SEED: ${LEADFORGE_DEMO_SEED:-42}
      LEADFORGE_DEMO_DELAY_MS: ${LEADFORGE_DEMO_DELAY_MS:-120}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-data:/app/data

  # Worker mode for the background job runner (Phase 6).
  # Same image as backend; entrypoint switches to worker mode.
  # NOTE: the `worker` CLI subcommand is implemented in Phase 6.
  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-leadforge}:${POSTGRES_PASSWORD:-leadforge}@db:5432/${POSTGRES_DB:-leadforge}
      LEADFORGE_PROVIDER: ${LEADFORGE_PROVIDER:-demo}
      LEADFORGE_AI_ENABLED: ${LEADFORGE_AI_ENABLED:-false}
      LEADFORGE_DEMO_SEED: ${LEADFORGE_DEMO_SEED:-42}
      LEADFORGE_DEMO_DELAY_MS: ${LEADFORGE_DEMO_DELAY_MS:-120}
    command: ["python", "-m", "leadforge", "worker"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  pgdata:
  backend-data:
