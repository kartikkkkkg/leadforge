services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadforge}
      POSTGRES_DB: ${POSTGRES_DB:-leadforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-leadforge}:${POSTGRES_PASSWORD:-leadforge}@db:5432/${POSTGRES_DB:-leadforge}
      LEADFORGE_PROVIDER: ${LEADFORGE_PROVIDER:-demo}
      LEADFORGE_AI_ENABLED: ${LEADFORGE_AI_ENABLED:-false}
      LEADFORGE_LLM_API_KEY: ${LEADFORGE_LLM_API_KEY:-}
      LEADFORGE_DEMO_SEED: ${LEADFORGE_DEMO_SEED:-42}
      LEADFORGE_DEMO_DELAY_MS: ${LEADFORGE_DEMO_DELAY_MS:-120}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-data:/app/data
    healthcheck:
      # python:3.12-slim has no curl; use the stdlib instead.
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\", timeout=5)'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # NOTE: there is deliberately no worker service. Research jobs execute
  # in-process on the API server via FastAPI BackgroundTasks (DESIGN.md A2 —
  # no Celery/Redis by design), so a separate worker container would have no
  # queue to consume and nothing meaningful to do. `python -m leadforge
  # worker` explains this.

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  pgdata:
  backend-data:
